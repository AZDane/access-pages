configuration:
  diagnostic_logging:
    name: Temporary diagnostic capture request
    description: >-
      Requests one capture for the selected duration after saving and restarting
      the App. The saved duration may remain displayed after capture expires;
      it is not current logging status. Restarting a consumed selection does not
      start another capture. To re-arm, select Off, save and restart, then select
      the desired duration, save and restart again.
  connector_id:
    name: Connector ID
    description: Optional stable connector name. Leave empty to generate one, and do not change it after registration.
  include_domains:
    name: Included domains
    description: >-
      Comma-separated Home Assistant domains enabled in the entity picker.
      Defaults to light,switch,fan,media_player,climate,vacuum,sensor.
      Leave empty to allow all domains, subject to other filters and exclusions.
      Domains are not safety classifications.
  include_areas:
    name: Included areas
    description: >-
      Optional comma-separated Home Assistant area IDs. Narrows the picker to
      those areas within the enabled domains; does not enable other domains.
  exclude_domains:
    name: Excluded domains
    description: Comma-separated domains hidden from the picker. Exclusions override inclusions.
  exclude_entities:
    name: Excluded entities
    description: Optional comma-separated entity IDs hidden from the picker. Exclusions override inclusions.
  qurl_max_lifetime_days:
    name: Maximum qURL lifetime
    description: Plan limit in days. Use 3 for LayerV Free or up to 30 when allowed by your plan.
  resource_isolation:
    name: LayerV resource isolation
    description: Guest (default) gives each guest a separate resource. Page shares one resource among guests on the same Access Page.
