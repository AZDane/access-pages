name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install pinned security tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.22 bandit==1.9.4

      - name: Check Python source
        run: ruff check --select E4,E7,E9,F .

      - name: Scan Python source for security issues
        run: bandit --ini .bandit -r .

      - name: Check JavaScript syntax
        run: |
          node --check static/admin.js
          node --check static/admin-api.js
          node --check static/access.js
          node --check static/access-api.js

      - name: Run test suite including browser regressions
        run: |
          command -v node
          python -m unittest discover -s tests -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  filesystem:
    name: Dependencies and repository configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Scan dependencies, configuration, and working tree
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Retain OCI images and attestations locally
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Build Home Assistant App image
        run: >-
          docker buildx build --load --provenance=mode=max --sbom=true
          --file Dockerfile.ha-app
          --build-arg BUILD_ARCH=amd64
          --tag access-pages-app:security-scan
          .

      - name: Scan built image secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: access-pages-app:security-scan
          scan-type: image
          scanners: misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Preserve the complete inventory before applying the reviewed baseline.
      - name: Prepare an empty ignore file for the complete scan
        if: ${{ !cancelled() }}
        run: |
          : > "$RUNNER_TEMP/no-vulnerability-ignores"

      - name: Report unfiltered image findings at every severity
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: access-pages-app:security-scan
          scan-type: image
          scanners: vuln
          format: json
          output: vulnerability-amd64.json
          trivyignores: ${{ runner.temp }}/no-vulnerability-ignores
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Reproduce packaged evidence and apply amd64 policy
        run: |
          python3 security/image_evidence.py access-pages-app:security-scan vulnerability-amd64.json --architecture amd64 --require-attestations > evidence-amd64.json
          python3 security/check_vulnerabilities.py vulnerability-amd64.json --architecture amd64 --evidence evidence-amd64.json

      - name: Retain complete amd64 vulnerability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerability-amd64-${{ github.sha }}
          path: |
            vulnerability-amd64.json
            evidence-amd64.json
          if-no-files-found: error
          retention-days: 90

      - name: Validate packaged amd64 application
        run: bash tests/check_packaged_image.sh access-pages-app:security-scan amd64

  arm64-package:
    name: ARM64 package
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Retain OCI images and attestations locally
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Build native ARM64 App image
        run: >-
          docker buildx build --load --provenance=mode=max --sbom=true --file Dockerfile.ha-app --build-arg BUILD_ARCH=aarch64
          --tag access-pages-app:arm64-test .
      - name: Prepare an empty ignore file for the complete scan
        if: ${{ !cancelled() }}
        run: |
          : > "$RUNNER_TEMP/no-vulnerability-ignores"

      - name: Report unfiltered ARM64 findings at every severity
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: access-pages-app:arm64-test
          scan-type: image
          scanners: vuln
          format: json
          output: vulnerability-arm64.json
          trivyignores: ${{ runner.temp }}/no-vulnerability-ignores
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Reproduce packaged evidence and apply arm64 policy
        run: |
          python3 security/image_evidence.py access-pages-app:arm64-test vulnerability-arm64.json --architecture arm64 --require-attestations > evidence-arm64.json
          python3 security/check_vulnerabilities.py vulnerability-arm64.json --architecture arm64 --evidence evidence-arm64.json

      - name: Retain complete arm64 vulnerability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerability-arm64-${{ github.sha }}
          path: |
            vulnerability-arm64.json
            evidence-arm64.json
          if-no-files-found: error
          retention-days: 90

      - name: Validate packaged ARM64 application
        run: bash tests/check_packaged_image.sh access-pages-app:arm64-test arm64
