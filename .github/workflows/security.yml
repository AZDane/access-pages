name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned security tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.22 bandit==1.9.4

      - name: Check Python source
        run: ruff check --select E4,E7,E9,F .

      - name: Scan Python source for security issues
        run: bandit --ini .bandit -r .

      - name: Check JavaScript syntax
        run: |
          node --check static/admin.js
          node --check static/admin-api.js
          node --check static/access.js
          node --check static/access-api.js

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  filesystem:
    name: Dependencies and repository configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Scan dependencies, configuration, and working tree
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Build Home Assistant App image
        run: >-
          docker build
          --file Dockerfile.ha-app
          --build-arg BUILD_ARCH=amd64
          --build-arg BUILD_VERSION=security-scan
          --tag access-pages-app:security-scan
          .

      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: access-pages-app:security-scan
          scan-type: image
          scanners: vuln,misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
