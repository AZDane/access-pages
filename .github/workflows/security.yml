name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ha-compatibility:
    name: Home Assistant Core (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2026.10.4"
            digest: sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
          - version: "2026.11.0"
            digest: sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Exercise real Core APIs and guest broker in isolation
        run: >-
          docker run --rm --network none --entrypoint python
          --env PYTHONPATH=/workspace --env PYTHONDONTWRITEBYTECODE=1
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          ghcr.io/home-assistant/home-assistant:${{ matrix.version }}@${{ matrix.digest }}
          /workspace/tests/live_ha_compatibility.py

  static-analysis:
    name: Static analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install pinned security tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.22 bandit==1.9.4 coverage==7.17.3

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"

      - name: Check Python source
        run: ruff check --select E4,E7,E9,F .

      - name: Scan Python source for security issues
        run: bandit --ini .bandit -r .

      - name: Check JavaScript syntax
        run: |
          node --check static/admin.js
          node --check static/admin-api.js
          node --check static/access.js
          node --check static/access-api.js

      - name: Run Python tests including simulated frontend regressions
        run: |
          coverage run -m unittest discover -s tests -v

      - name: Report Python branch coverage
        if: ${{ !cancelled() }}
        run: |
          coverage report
          coverage xml

      - name: Retain Python coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser --ignore-scripts
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix tests/browser test
      - name: Retain browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ github.sha }}
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          if-no-files-found: error
          retention-days: 14

  go-tests:
    name: Go race tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - run: go test -race -count=1 -timeout=5m -coverprofile=coverage-go.out ./cmd/guest-endpoint
      - name: Retain Go coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-${{ github.sha }}
          path: coverage-go.out
          if-no-files-found: error

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  filesystem:
    name: Dependencies and repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Scan dependencies, configuration, and working tree
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  package:
    name: Package (${{ matrix.arch }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            ha_arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Retain OCI images and attestations locally
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Build and verify standalone stable Python image
        run: |
          docker build --file Dockerfile --tag access-pages:standalone-test .
          docker run --rm --network none --entrypoint python \
            --env HA_BASE_URL=http://127.0.0.1:8123 \
            --env HA_TOKEN=smoke-test-only --env ADMIN_TOKEN=smoke-test-only \
            access-pages:standalone-test -c '
          import sys, sqlite3, ssl
          assert sys.version_info[:3] == (3, 15, 2), sys.version
          assert sys.version_info.releaselevel == "final", sys.version
          import server, actions, admin, access
          print(sys.version, sqlite3.sqlite_version, ssl.OPENSSL_VERSION)
          '

      - name: Build native final-version App image
        run: >-
          docker buildx build --load --provenance=mode=max --sbom=true
          --file Dockerfile.ha-app --build-arg BUILD_ARCH=${{ matrix.ha_arch }}
          --tag access-pages-app:${{ matrix.arch }} .

      - name: Scan image secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: access-pages-app:${{ matrix.arch }}
          scan-type: image
          scanners: misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Prepare an empty ignore file for the complete scan
        if: ${{ !cancelled() }}
        run: ': > "$RUNNER_TEMP/no-vulnerability-ignores"'

      - name: Report every vulnerability without filtering
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          version: v0.76.1
          image-ref: access-pages-app:${{ matrix.arch }}
          scan-type: image
          scanners: vuln
          format: json
          output: vulnerability-${{ matrix.arch }}.json
          trivyignores: ${{ runner.temp }}/no-vulnerability-ignores
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Reproduce packaged evidence and apply policy
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 security/image_evidence.py "access-pages-app:$ARCH" "vulnerability-$ARCH.json" --architecture "$ARCH" --require-attestations > "evidence-$ARCH.json"
          python3 security/check_vulnerabilities.py "vulnerability-$ARCH.json" --architecture "$ARCH" --evidence "evidence-$ARCH.json"

      - name: Retain complete vulnerability and artifact evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-${{ matrix.arch }}-${{ github.sha }}
          path: |
            vulnerability-${{ matrix.arch }}.json
            evidence-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Validate packaged application
        run: bash tests/check_packaged_image.sh access-pages-app:${{ matrix.arch }} ${{ matrix.arch }}

  container:
    # Preserve the protected check name; failed/skipped dependencies cannot pass.
    name: Container image
    if: ${{ always() }}
    needs: [package, ha-compatibility, browser, go-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require packages, HA compatibility, browser journeys and Go race tests
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          HA_RESULT: ${{ needs.ha-compatibility.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          GO_RESULT: ${{ needs.go-tests.result }}
        run: |
          for result in "$PACKAGE_RESULT" "$HA_RESULT" "$BROWSER_RESULT" "$GO_RESULT"; do
            test "$result" = success || exit 1
          done
