name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.1"

      - name: Install pinned security tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.22 bandit==1.9.4

      - name: Check Python source
        run: ruff check --select E4,E7,E9,F .

      - name: Scan Python source for security issues
        run: bandit --ini .bandit -r .

      - name: Check JavaScript syntax
        run: |
          node --check static/admin.js
          node --check static/admin-api.js
          node --check static/access.js
          node --check static/access-api.js

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  filesystem:
    name: Dependencies and repository configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Scan dependencies, configuration, and working tree
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Build Home Assistant App image
        run: >-
          docker build
          --file Dockerfile.ha-app
          --build-arg BUILD_ARCH=amd64
          --build-arg BUILD_VERSION=security-scan
          --tag access-pages-app:security-scan
          .

      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: access-pages-app:security-scan
          scan-type: image
          scanners: vuln,misconfig,secret
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Add Node only to a disposable unit-test image
        run: |
          docker build --tag access-pages-app:unit-tests - <<'EOF'
          FROM access-pages-app:security-scan
          COPY --from=node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205 /usr/local/bin/node /usr/local/bin/node
          EOF

      - name: Run unit suite in the shipped Python runtime
        run: >-
          docker run --rm --network none --user 1000:1000 --entrypoint python
          --volume "$PWD:/src:ro" --workdir /src --env PYTHONPATH=/src
          access-pages-app:unit-tests -m unittest discover -s tests -v

      - name: Exercise packaged services and identities on AMD64
        run: >-
          docker run --rm --network none --user root --entrypoint python
          --volume "$PWD/tests/packaged_security_probe.py:/tmp/probe.py:ro"
          access-pages-app:security-scan /tmp/probe.py

      - name: Verify AppArmor executable enforcement when supported
        run: |
          case "$(docker info --format '{{json .SecurityOptions}}')" in
            *name=apparmor*) ;;
            *) echo "AppArmor enforcement unavailable on this runner"; exit 0 ;;
          esac
          sudo apparmor_parser --replace homeassistant-app/apparmor.txt
          trap 'sudo apparmor_parser --remove homeassistant-app/apparmor.txt' EXIT
          docker run --rm --interactive --network none --entrypoint python \
            --security-opt apparmor=access_pages access-pages-app:security-scan - <<'PY'
          import subprocess
          import sys

          assert sys.version_info[:2] == (3, 15), sys.version
          for executable in ("/usr/local/bin/python", "/usr/local/bin/python3", "/usr/local/bin/python3.15"):
              subprocess.run([executable, "-c", "import ssl"], check=True)
          try:
              subprocess.run(["/bin/sh", "-c", "exit 0"], check=True)
          except PermissionError:
              print("AppArmor: selected Python and aliases execute; shell execution denied")
          else:
              raise AssertionError("AppArmor allowed an unlisted executable")
          PY

      - name: Verify Gateway startup with unavailable logging
        run: >-
          docker run --rm --network none --user root --entrypoint python
          --volume "$PWD/tests/packaged_startup_probe.py:/tmp/probe.py:ro"
          access-pages-app:security-scan /tmp/probe.py

      - name: Verify runtime permission repair with service identities
        run: >-
          docker run --rm --network none --user root --entrypoint python
          --volume "$PWD/tests/packaged_permission_probe.py:/tmp/probe.py:ro"
          access-pages-app:security-scan /tmp/probe.py

      - name: Verify packaged qURL supervision and lifetime lock
        run: >-
          docker run --rm --network none --user 2103:2103 --entrypoint python
          --volume "$PWD/tests/packaged_qurl_probe.py:/tmp/probe.py:ro"
          access-pages-app:security-scan /tmp/probe.py

  arm64-package:
    name: ARM64 package
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Build native ARM64 App image
        run: >-
          docker build --file Dockerfile.ha-app --build-arg BUILD_ARCH=aarch64
          --build-arg BUILD_VERSION=security-scan --tag access-pages-app:arm64-test .
      - name: Exercise packaged services and identities on ARM64
        run: >-
          docker run --rm --network none --user root --entrypoint python
          --volume "$PWD/tests/packaged_security_probe.py:/tmp/probe.py:ro"
          access-pages-app:arm64-test /tmp/probe.py
      - name: Verify Gateway startup with unavailable logging on ARM64
        run: >-
          docker run --rm --network none --user root --entrypoint python
          --volume "$PWD/tests/packaged_startup_probe.py:/tmp/probe.py:ro"
          access-pages-app:arm64-test /tmp/probe.py

      - name: Verify runtime permission repair with service identities on ARM64
        run: >-
          docker run --rm --network none --user root --entrypoint python
          --volume "$PWD/tests/packaged_permission_probe.py:/tmp/probe.py:ro"
          access-pages-app:arm64-test /tmp/probe.py

      - name: Verify packaged qURL supervision and lifetime lock on ARM64
        run: >-
          docker run --rm --network none --user 2103:2103 --entrypoint python
          --volume "$PWD/tests/packaged_qurl_probe.py:/tmp/probe.py:ro"
          access-pages-app:arm64-test /tmp/probe.py
