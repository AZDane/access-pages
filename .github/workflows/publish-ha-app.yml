name: Publish Home Assistant App

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Version matching homeassistant-app/config.yaml
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-ha-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read and validate App version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          requested = os.environ["REQUESTED_VERSION"].removeprefix("v")
          config = Path("homeassistant-app/config.yaml").read_text()
          expected = next(
              line.split(":", 1)[1].strip().strip('"')
              for line in config.splitlines()
              if line.startswith("version:")
          )
          if requested != expected:
              raise SystemExit(
                  f"Requested version {requested!r} does not match "
                  f"config.yaml version {expected!r}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"value={expected}", file=output)
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ha-app
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.validate.outputs.version }}
          tags: |
            ghcr.io/azdane/access-pages-app:${{ needs.validate.outputs.version }}-${{ matrix.arch }}
            ghcr.io/azdane/access-pages-app:latest-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  manifest:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Publish versioned multi-architecture manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/azdane/access-pages-app:${VERSION}" \
            "ghcr.io/azdane/access-pages-app:${VERSION}-amd64" \
            "ghcr.io/azdane/access-pages-app:${VERSION}-aarch64"

      - name: Publish latest multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/azdane/access-pages-app:latest \
            ghcr.io/azdane/access-pages-app:latest-amd64 \
            ghcr.io/azdane/access-pages-app:latest-aarch64

      - name: Sign the versioned image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          IMAGE="ghcr.io/azdane/access-pages-app:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect \
            "${IMAGE}" | awk '/^Digest:/ {print $2; exit}')"
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
